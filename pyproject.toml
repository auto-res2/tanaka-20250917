[project]
name = "unirisk-t"
version = "0.1.0"
description = "UniRISK-T: Unified, Trustworthy, Token-Aware Risk Transformer"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    "scipy>=1.9.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
