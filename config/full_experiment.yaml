experiment:
  name: "UniRISK-T Full Experiment"
  epochs: 2
  batch_size: 32
  learning_rate: 5e-6
  warmup_steps: 250
  max_samples: 120000
  
model:
  policy_model: "microsoft/phi-2"
  reward_model: "microsoft/deberta-v3-large"
  
data:
  train_samples: 115000
  val_samples: 5000
  max_length: 4096
  
risk:
  tau_samples: 16
  beta: 1.0
  alpha: 0.1
  gamma: 0.5
  K: 4
  
output:
  save_dir: ".research/iteration2"
  log_interval: 100
