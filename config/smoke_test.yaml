experiment:
  name: "UniRISK-T Smoke Test"
  epochs: 1
  batch_size: 2
  learning_rate: 5e-6
  warmup_steps: 10
  max_samples: 100
  
model:
  policy_model: "microsoft/phi-2"
  reward_model: "microsoft/deberta-v3-large"
  
data:
  train_samples: 80
  val_samples: 20
  max_length: 128
  
risk:
  tau_samples: 4
  beta: 1.0
  alpha: 0.1
  gamma: 0.5
  K: 4
  
output:
  save_dir: ".research/iteration8"
  log_interval: 5
